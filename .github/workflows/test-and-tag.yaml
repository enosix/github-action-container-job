name: Build and Tag
on:
  pull_request:
    paths-ignore:
      - dist/**
  push:
    branches:
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:
    inputs:
      bump:
        description: 'The type of semantic version increment to make'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
          - none
      dry_run:
        description: 'If true, only calculate the new version and exit successfully.'
        required: false
        default: false

env:
  bump: ${{ github.event_name == 'pull_request' && 'none' || github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
  prerelease_version: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || '' }}
  dry_run: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:24
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.email ${GITHUB_ACTOR}@users.noreply.github.com
          git config --global user.name "github-actions[bot]"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - name: pnpm install
        run: pnpm install

      - name: pnpm run build
        run: pnpm run build

      - name: pnpm run test
        run: pnpm exec node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results.xml src/test.js

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: 'test-results.xml'
          detailed_summary: true
          include_passed: true
          group_suite: true
          resolve_ignore_classname: true
          check_title_template: '{{TEST_NAME}}'

      - name: Remove Test Report
        if: always()
        run: rm -f test-results.xml
      
      - name: Commit and Push
        id: commit
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=0">> $GITHUB_OUTPUT
            echo "No changes"
            exit 0
          fi
          
          echo "changed=1">> $GITHUB_OUTPUT
          git add -A
          git commit -m "Build Release"
          git push

      - name: Generate Semantic Version
        uses: enosix/github-action-generate-semver@0db52174578015a9471b9342427b97dc4e031cf2 # v5.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump: ${{ env.bump }}
          prerelease_version: ${{ env.prerelease_version }}
          dry_run: ${{ env.dry_run }}
          create_release: ${{ github.event_name == 'push' }}
          detect_bump: ${{ github.event_name == 'push' }}
